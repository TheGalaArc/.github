name: Feature request
description: Propose a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: user-story
    attributes:
      label: User story
      description: "Format: As a <user type>, I want <goal> so that <benefit>."
      placeholder: As a customer, I want to filter providers by rating so I can find the best ones quickly.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Bullet list of conditions that must be true for this to be considered done.
      placeholder: |
        - [ ] Filter UI appears on the provider list screen
        - [ ] Selecting a rating range updates results in <500ms
        - [ ] Empty state shown when no providers match
    validations:
      required: true

  - type: textarea
    id: mockups
    attributes:
      label: Mockups and references
      description: Figma links, screenshots, or examples from other apps.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Edge cases, technical considerations, related issues.
